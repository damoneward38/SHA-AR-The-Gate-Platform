      // Ignore HMR / WebSocket errors per environment constraints (HMR disabled in AI Studio iframe)
      window.addEventListener('unhandledrejection', function (e) {
        if (
          e.reason &&
          (e.reason.message?.includes('WebSocket') ||
           e.reason.message?.includes('ws') ||
           e.reason.stack?.includes('@vite/client'))
        ) {
          e.preventDefault();
        }
      });
